# Docker Compose bundle for the standalone image: Caddy serves HTTPS in front of the MCP
# server, in one container. Pre-configured for mantle.scipai.sandbox.sciencecloud.nasa.gov and
# git.smce.nasa.gov; override any ${...} value from the shell or a .env file next to this one.
#
#   docker compose up -d
#
# TLS: put the certificate (followed by any intermediates) and its private key in ./certs as
# tls.crt and tls.key, readable by uid 10001 (sudo chown 10001 certs/tls.key). Without them,
# Caddy issues a certificate from its own local CA, and clients must trust that CA's root:
#
#   docker compose cp mcp-gitlab:/data/caddy/pki/authorities/local/root.crt mcp-gitlab-ca.crt
#
# Clients connect to https://<MCP_PUBLIC_HOST>/mcp and send their own GitLab PAT on every request.

name: mcp-gitlab

services:
  mcp-gitlab:
    image: ${MCP_GITLAB_IMAGE:-ghcr.io/weatherills/mcp-gitlab:latest}
    build:
      context: ..
      target: standalone
    restart: unless-stopped
    ports:
      - "${MCP_HTTPS_HOST_PORT:-443}:8443"
    environment:
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST:-mantle.scipai.sandbox.sciencecloud.nasa.gov}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://git.smce.nasa.gov/api/v4}
      # If a private CA issued GitLab's certificate: that CA bundle, in ./certs (for example
      # /certs/gitlab-ca.pem). It replaces the system CAs, so include every CA needed.
      GITLAB_CA_BUNDLE: ${GITLAB_CA_BUNDLE:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Caddy's local CA and certificates: keep this volume, or clients must trust a new CA.
      - caddy-data:/data
      - ./certs:/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
