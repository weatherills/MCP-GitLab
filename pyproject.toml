[project]
name = "mcp-gitlab"
version = "0.1.0"
description = "HTTPS GitLab MCP server that connects to non-enterprise GitLab servers using PATs"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "The Weatherills Family", email = "brian@weatherills.com" }]
requires-python = ">=3.10"
dependencies = [
    # Official MCP SDK. Do not assume the latest release matches this project's
    # target protocol revision (2025-11-25) without checking first -
    # see CLAUDE.md, "Before you write server.py".
    "mcp[cli]",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
mcp-gitlab = "mcp_gitlab.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gitlab"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["mcp_gitlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
