[project]
name = "mcp-gitlab"
version = "0.1.0"
description = "HTTPS GitLab MCP server that connects to non-enterprise GitLab servers using PATs"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "The Weatherills Family", email = "brian@weatherills.com" }]
requires-python = ">=3.10"
dependencies = [
    # 2.x serves protocol 2025-11-25 (PRD-00's target) and 2026-07-28 from one endpoint.
    "mcp>=2.2,<3",
    "httpx>=0.28",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "starlette>=1.0",
    "uvicorn>=0.30",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2",
    "jsonschema>=4.18",
]

[project.scripts]
mcp-gitlab = "mcp_gitlab.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gitlab"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["mcp_gitlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
